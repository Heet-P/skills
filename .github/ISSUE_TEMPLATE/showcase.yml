name: Showcase
description: You built something with these skills
labels: [showcase]
body:
  - type: input
    id: link
    attributes:
      label: Link (live site, video, or repo)
    validations:
      required: true
  - type: input
    id: skills
    attributes:
      label: Which skills or commands did you use?
      placeholder: /web3d camera, /web3d glow
  - type: textarea
    id: notes
    attributes:
      label: Anything the skill got wrong or you had to fix by hand?
